name: Independent native GNU ARM binutils
# Manual only: macOS minutes bill at 10x and Windows at 2x on private repos,
# and these artifacts are only consumed by an explicit native-sdk.yml dispatch.
on:
  workflow_dispatch:
    inputs:
      host:
        description: Host to build (all for every host)
        type: choice
        default: all
        options: [all, linux-x64, windows-x64, macos-x64, macos-arm64]
concurrency:
  group: native-binutils-${{ github.ref }}-${{ inputs.host }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    if: inputs.host == 'all' || inputs.host == 'linux-x64'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare existing named Compose service
        run: |
          python3 -c 'import json; print("CTR_IMAGE=" + json.load(open("toolchain/versions.json"))["container"]["image"])' >> "$GITHUB_ENV"
          echo "CTR_STATE_DIR=$RUNNER_TEMP/ctr-native-binutils" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ctr-native-binutils/cache" "$RUNNER_TEMP/ctr-native-binutils/tmp"
      - name: Build and verify native Linux tools in Compose
        run: |
          docker compose config
          docker compose up -d toolchain
          docker compose exec -T -e PYTHONDONTWRITEBYTECODE=1 toolchain python3 -B -m unittest discover -s release/test -p test_native_binutils.py
          docker compose exec -T -e PYTHONDONTWRITEBYTECODE=1 toolchain python3 -B release/native_binutils.py --target linux-x64 --work /state/binutils-build --output /work/out/native-binutils
      - uses: actions/upload-artifact@v4
        with:
          name: ctr-binutils-linux-x64
          path: out/native-binutils/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain failed build evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctr-binutils-linux-x64-failure
          path: |
            ${{ runner.temp }}/ctr-native-binutils/binutils-build/logs/
            ${{ runner.temp }}/ctr-native-binutils/binutils-build/build/**/config.log
          if-no-files-found: warn
      - name: Stop Compose service
        if: always()
        run: docker compose down
  native:
    if: inputs.host != 'linux-x64'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.host == 'all' && '["windows-x64","macos-x64","macos-arm64"]' || format('["{0}"]', inputs.host)) }}
    runs-on: ${{ fromJSON('{"windows-x64":"windows-2025","macos-x64":"macos-15-intel","macos-arm64":"macos-15"}')[matrix.target] }}
    steps:
      - name: Keep source checkout bytes consistent
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: Install Windows producer tools only
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            texinfo
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-binutils
      - name: Build and verify native Windows tools
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python -B -m unittest discover -s release/test -p test_native_binutils.py
          python -B release/native_binutils.py --target windows-x64 --work out/binutils-work --output out/native-binutils
      - name: Build and verify native macOS tools
        if: runner.os == 'macOS'
        run: |
          python3 -B -m unittest discover -s release/test -p test_native_binutils.py
          python3 -B release/native_binutils.py --target ${{ matrix.target }} --work out/binutils-work --output out/native-binutils
      - uses: actions/upload-artifact@v4
        with:
          name: ctr-binutils-${{ matrix.target }}
          path: out/native-binutils/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain failed build evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctr-binutils-${{ matrix.target }}-failure
          path: |
            out/binutils-work/logs/
            out/binutils-work/build/**/config.log
          if-no-files-found: warn

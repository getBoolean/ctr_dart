name: Native CTR precompiler producer
# Manual only: macOS minutes bill at 10x and Windows at 2x on private repos,
# and these artifacts are only consumed by an explicit native-sdk.yml dispatch.
on:
  workflow_dispatch:
    inputs:
      host:
        description: Host to build (all for every host)
        type: choice
        default: all
        options: [all, windows-x64, macos-x64, macos-arm64]
concurrency:
  group: native-precompiler-${{ github.ref }}-${{ inputs.host }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-precompiler:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        host: ${{ fromJSON(inputs.host == 'all' && '["windows-x64","macos-x64","macos-arm64"]' || format('["{0}"]', inputs.host)) }}
    runs-on: ${{ fromJSON('{"windows-x64":"windows-2022","macos-x64":"macos-15-intel","macos-arm64":"macos-15"}')[matrix.host] }}
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Keep producer source and tool caches outside the checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the SDK required by the pinned Windows toolchain helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pin = Get-Content release/native-windows-sdk.json -Raw | ConvertFrom-Json
          $installer = Join-Path $env:RUNNER_TEMP 'ctr-winsdksetup.exe'
          Invoke-WebRequest -Uri $pin.url -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Windows SDK installer hash mismatch' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Windows SDK installer signature mismatch' }
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet /norestart /features OptionId.DesktopCPPx64 OptionId.DesktopCPPx86 OptionId.UWPCPP' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "Windows SDK installation failed: $($process.ExitCode)" }
          $header = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/Include/$($pin.include_version)/um/Windows.h"
          if (-not (Test-Path -LiteralPath $header)) { throw "Required Windows SDK header is missing: $header" }
      - name: Build native CTR gen_snapshot
        shell: bash
        run: >-
          python release/native_precompiler.py
          --work-dir "$RUNNER_TEMP/ctr-native-producer"
          --output-dir "$GITHUB_WORKSPACE/native-output"
          --jobs ${{ fromJSON('{"windows-x64":4,"macos-x64":4,"macos-arm64":3}')[matrix.host] }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-precompiler-${{ matrix.host }}
          path: native-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Preserve failed producer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-precompiler-failure-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/ctr-native-producer/native-build/args.gn
            ${{ runner.temp }}/ctr-native-producer/native-build/.ninja_log
            ${{ runner.temp }}/ctr-native-producer/native-build/gen/runtime/version.cc
            ${{ runner.temp }}/ctr-native-producer/sdk/.git/ctr-source.json
          if-no-files-found: warn

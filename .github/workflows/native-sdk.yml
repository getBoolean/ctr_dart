name: Complete native CTR SDK bundles
on:
  push:
    paths:
      - .github/workflows/native-sdk.yml
  workflow_dispatch:
    inputs:
      host:
        description: Native host to qualify (all for the complete release)
        type: choice
        default: all
        options: [all, linux-x64, windows-x64, macos-x64, macos-arm64]
      precompiler_run:
        description: Successful native precompiler producer run
        required: true
        type: string
      binutils_run:
        description: Successful native GNU binutils producer run
        required: true
        type: string
      runtime_tag:
        description: Release containing ctr-runtime-assets.zip
        required: true
        type: string
      runtime_sha256:
        description: SHA256 of ctr-runtime-assets.zip
        required: true
        type: string
      linux_precompiler_sha256:
        description: SHA256 of the source-verified Linux compiler component asset
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  registration:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Native SDK assembly requires an explicit workflow_dispatch with verified component inputs.'
  bundle:
    if: github.event_name == 'workflow_dispatch'
    # GitHub requires push access to read unpublished draft release assets.
    permissions:
      contents: write
      actions: read
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.host == 'all' && '["linux-x64","windows-x64","macos-x64","macos-arm64"]' || format('["{0}"]', inputs.host)) }}
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","windows-x64":"windows-2022","macos-x64":"macos-15-intel","macos-arm64":"macos-15"}')[matrix.host] }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify component producer runs
        # download-artifact accepts any run in the repository, including fork
        # pull requests; the artifacts' own hashes only vouch for themselves.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRECOMPILER_RUN: ${{ inputs.precompiler_run }}
          BINUTILS_RUN: ${{ inputs.binutils_run }}
        run: |
          set -euo pipefail
          verify() {
            local run="$1" workflow="$2"
            [[ "$run" =~ ^[0-9]+$ ]] || { echo "::error::run id '$run' is not numeric"; exit 1; }
            local record
            record=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
              --jq '[.path, .event, .conclusion, .head_repository.full_name] | join(" ")')
            read -r path event conclusion repository <<< "$record"
            if [[ "$path" != ".github/workflows/$workflow" || "$conclusion" != success ||
                  "$repository" != "$GITHUB_REPOSITORY" ||
                  ( "$event" != push && "$event" != workflow_dispatch ) ]]; then
              echo "::error::run $run is not a successful $workflow push/dispatch run in $GITHUB_REPOSITORY (got: $record)"
              exit 1
            fi
            echo "Verified run $run: $record"
          }
          verify "$PRECOMPILER_RUN" native-precompiler.yml
          verify "$BINUTILS_RUN" native-binutils.yml
      - uses: actions/download-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: native-precompiler-${{ matrix.host }}
          path: inputs/precompiler
          run-id: ${{ inputs.precompiler_run }}
          github-token: ${{ github.token }}
      - name: Download source-verified native Linux compiler component
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
          COMPONENT_SHA256: ${{ inputs.linux_precompiler_sha256 }}
        run: |
          gh release download "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern ctr-native-precompiler-linux-x64.zip --dir inputs
          python -c 'import hashlib,os,pathlib,zipfile; p=pathlib.Path("inputs/ctr-native-precompiler-linux-x64.zip"); assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ["COMPONENT_SHA256"], "Linux component hash mismatch"; z=zipfile.ZipFile(p); assert all(not pathlib.PurePosixPath(n).is_absolute() and ".." not in pathlib.PurePosixPath(n).parts and "\\" not in n for n in z.namelist()); z.extractall("inputs/precompiler")'
      - uses: actions/download-artifact@v4
        with:
          name: ctr-binutils-${{ matrix.host }}
          path: inputs/binutils
          run-id: ${{ inputs.binutils_run }}
          github-token: ${{ github.token }}
      - name: Download attributed precompiled target assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
          RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
        run: |
          gh release download "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern ctr-runtime-assets.zip --dir inputs
          python -c 'import hashlib,os,pathlib,zipfile; p=pathlib.Path("inputs/ctr-runtime-assets.zip"); assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ["RUNTIME_SHA256"], "runtime asset hash mismatch"; z=zipfile.ZipFile(p); assert all(not pathlib.PurePosixPath(n).is_absolute() and ".." not in pathlib.PurePosixPath(n).parts and "\\" not in n for n in z.namelist()); z.extractall("inputs/runtime")'
      - name: Prepare named Linux producer environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -c 'import json; print("CTR_IMAGE=" + json.load(open("toolchain/versions.json"))["container"]["image"])' >> "$GITHUB_ENV"
          echo "CTR_STATE_DIR=$RUNNER_TEMP/ctr-sdk-producer" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ctr-sdk-producer/cache" "$RUNNER_TEMP/ctr-sdk-producer/tmp"
      - name: Compile, bundle and exercise Linux SDK
        if: runner.os == 'Linux'
        run: |
          docker compose config
          docker compose up -d toolchain
          docker compose exec -T -e PUB_CACHE=/state/cache/pub toolchain python3 -B release/build_native_sdk.py --precompiler /work/inputs/precompiler --binutils /work/inputs/binutils --runtime /work/inputs/runtime --output /work/out/native-sdk
      - name: Compile, bundle and exercise native Windows/macOS SDK
        if: runner.os != 'Linux'
        shell: bash
        run: python release/build_native_sdk.py --precompiler inputs/precompiler --binutils inputs/binutils --runtime inputs/runtime --output out/native-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: complete-native-sdk-${{ matrix.host }}
          path: |
            out/native-sdk/*.zip
            out/native-sdk/verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed application-build evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: complete-native-sdk-failure-${{ matrix.host }}
          path: out/native-sdk/
          if-no-files-found: warn
          retention-days: 3
      - name: Stop Linux producer environment
        if: always() && runner.os == 'Linux' && env.CTR_IMAGE != ''
        run: docker compose down
